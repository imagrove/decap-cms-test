# 本地模式配置：只在 localhost 下生效（由 admin/index.html 按 hostname 切换）。
# collections 与 config.yml 保持一致——YAML 无法引用，改字段时两边同步。
local_backend: true

backend:
  name: github
  repo: imagrove/decap-cms-test
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: 文章
    label_singular: 一篇文章
    folder: src/content/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    sortable_fields: [date, title]
    view_filters:
      - label: 只看草稿
        field: draft
        pattern: true
    fields:
      - name: title
        label: 标题
        widget: string
      - name: date
        label: 发布日期
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - name: description
        label: 摘要
        widget: text
        required: false
      - name: cover
        label: 封面图
        widget: image
        required: false
      - name: tags
        label: 标签
        widget: list
        required: false
        default: []
      - name: draft
        label: 草稿
        widget: boolean
        default: false
      - name: body
        label: 正文
        widget: markdown
