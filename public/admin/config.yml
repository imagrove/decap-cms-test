backend:
  name: github
  repo: imagrove/decap-cms-test
  branch: main
  # Cloudflare Worker OAuth 回调服务，部署后回填实际地址
  base_url: https://decap-oauth.__ACCOUNT__.workers.dev
  auth_endpoint: auth

site_url: https://imagrove.github.io/decap-cms-test/
display_url: https://imagrove.github.io/decap-cms-test/
logo_url: https://imagrove.github.io/decap-cms-test/favicon.svg

# 写稿默认直接提交 main。需要草稿审阅流程时改成 editorial_workflow，
# 那样每次保存会走分支 + Pull Request，适合多人协作但步骤变多。
publish_mode: simple

media_folder: public/uploads
public_folder: /decap-cms-test/uploads

collections:
  - name: posts
    label: 文章
    label_singular: 一篇文章
    description: 写入 src/content/posts/，字段与 src/content.config.ts 的 schema 对应
    folder: src/content/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    sortable_fields: [date, title]
    view_filters:
      - label: 只看草稿
        field: draft
        pattern: true
    fields:
      - name: title
        label: 标题
        widget: string
      - name: date
        label: 发布日期
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - name: description
        label: 摘要
        widget: text
        required: false
        hint: 显示在列表页，也作为页面 description
      - name: cover
        label: 封面图
        widget: image
        required: false
        hint: 上传后落到 public/uploads/
      - name: tags
        label: 标签
        widget: list
        required: false
        default: []
      - name: draft
        label: 草稿
        widget: boolean
        default: false
        hint: 草稿只在本地开发模式可见，线上构建会过滤掉
      - name: body
        label: 正文
        widget: markdown

  - name: products
    label: 产品
    label_singular: 一个产品
    description: 写入 src/content/products/，一个 md 文件就是一个产品，删除文件即下架
    folder: src/content/products
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    identifier_field: name
    sortable_fields: [order, name, model]
    view_groups:
      - label: 分类
        field: category
    fields:
      - name: name
        label: 产品名称
        widget: string
      - name: model
        label: 型号
        widget: string
        required: false
      - name: category
        label: 分类
        widget: select
        options:
          - { label: 显示与交互, value: display }
          - { label: 传感与采集, value: sensor }
          - { label: 通信与网关, value: connectivity }
          - { label: 电源与控制, value: power }
          - { label: 配件与模块, value: accessory }
        hint: 新增分类需同步 src/lib/categories.ts 与 src/content.config.ts 的 enum
      - name: summary
        label: 一句话卖点
        widget: text
        hint: 列表卡片与详情页顶部都显示这句
      - name: cover
        label: 主图
        widget: image
        required: false
        hint: 建议 16:9，上传后落到 public/uploads/
      - name: gallery
        label: 图集
        widget: list
        required: false
        default: []
        hint: 逐张添加图片路径（Decap 的 list 默认按字符串数组写入）
      - name: features
        label: 核心特点
        widget: list
        required: false
        default: []
        hint: 建议 3 条，每条一行标题加一行说明
        fields:
          - { name: title, label: 标题, widget: string }
          - { name: detail, label: 说明, widget: text, required: false }
      - name: specs
        label: 技术规格
        widget: list
        required: false
        default: []
        hint: 一行一项，逐项追加
        fields:
          - { name: label, label: 项目, widget: string }
          - { name: value, label: 内容, widget: string }
      - name: moq
        label: 起订量
        widget: string
        required: false
        hint: 如「50 台」
      - name: lead_time
        label: 交期
        widget: string
        required: false
        hint: 如「4–6 周」
      - name: status
        label: 状态
        widget: select
        options:
          - { label: 在售, value: active }
          - { label: 停产, value: eol }
        default: active
      - name: featured
        label: 首页精选
        widget: boolean
        default: false
      - name: order
        label: 排序权重
        widget: number
        value_type: int
        default: 100
        hint: 数字小的排前面

