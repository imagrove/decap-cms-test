<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>内容后台 · Decap CMS</title>
  </head>
  <body>
    <script>
      // Decap 必须在 body 内加载（放 head 里会在初始化时抛 appendChild of null）。
      // 本地开发走 decap-server，改动直接写进本地 git，不需要 GitHub 登录。
      // 注意 Decap 只认带 type="text/yaml" 的 cms-config-url，少这个属性会被忽略。
      (function () {
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (isLocal) {
          var link = document.createElement('link');
          link.rel = 'cms-config-url';
          link.type = 'text/yaml';
          link.href = 'config.local.yml';
          document.head.appendChild(link);
        }
        // 锁定精确版本，不用 ^ 号，避免上游发版后后台被静默替换
        var script = document.createElement('script');
        script.src = 'https://unpkg.com/decap-cms@3.18.0/dist/decap-cms.js';
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
